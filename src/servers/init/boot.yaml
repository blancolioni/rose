# The boot description (#374): which boot modules GRUB loads, and how
# init starts them.  scripts/make-init turns it into the package
# Init.Boot (build/generated), and writes the module2 lines of the two
# GRUB menus.
#
# There are two variants.  The install media's (install) loads
# init-install and restore-install, and the boot disk's (disk) loads init
# and restore (#373).  An entry with 'when: install' or 'when: disk'
# belongs to that variant only.
#
# Caps are named.  A name is one of init's fixed caps
# (Rose.Init_Capabilities, without _Cap), or a name given earlier by an
# export, an endpoint or a call.  Each name is a variable in Init.Boot,
# called Name_Cap, which is null until it is set.
#
# Steps:
#
#   launch: MODULE   launch a boot module, with:
#     oid            its object id, which never changes (#372)
#     priority       one of the priorities below
#     cap_set        the cap that makes cap sets, if not cap_set; 'none'
#                    for none
#     caps           the caps it is given, in order: a name;
#                    {cap: name, when: variant}; {ports: [endpoint, size,
#                    first, last]}; {interrupt: vector}; {device_page:
#                    page}; or {boot_tag: type}, which reads the boot
#                    loader's tag of that type.  Ports, interrupts and
#                    device pages are granted to the module
#                    (Init.Grants), or to nobody with 'owner: none'.
#                    Any of these but a name can have 'when: variant',
#                    and is a null cap in the other variant.  Caps with
#                    'when' come last.
#     words          data words for the launch, if any
#     exports        names for endpoints copied from it: an endpoint, or
#                    {endpoint: e, identifier: n, when: variant}.
#                    Endpoints are named relative to Rose.Interfaces.
#
#   endpoint: E      an endpoint of init's own, with 'receiver' and
#                    'sender' naming the caps it makes
#
#   call: NAME       a procedure in Init.Boot_Steps, for what isn't
#                    wiring; 'sets' names the caps it may set

modules:
  # Module 1 is init.  The order is GRUB's, which the kernel checks
  # against its own lists in src/kernel/modules/rose-kernel-modules-init.adb.
  - {name: init, install: init-install}
  - console
  - mem
  - pci
  - ata
  - store
  - {name: isofs, when: install}
  - {name: restore, install: restore-install}
  - scan
  - partition
  - elf
  - timer
  - bootcaps
  - checkpoint
  - log

grub:
  install: boot/iso/grub/grub.cfg
  disk: boot/hd0/menu.cfg

priorities:
  memory: 2
  device_driver: 5
  file_system: 10
  low: 12
  log: 13
  checkpoint: 14

# Object ids of servers that a call launches.  The kernel gives idle and
# init ids 1 and 2.
oids:
  swap_partition: 11
  log_partition: 17
  # The install media's partition servers for writing the boot loader
  # (#322): block 0, which holds the MBR, and the BIOS boot and boot
  # partitions.
  mbr: 18
  bios_boot: 19
  boot_partition: 20

stages:

  boot_servers:

    # The boot modules' cap sets.  Every module launched after it reads
    # its caps from its set at startup, and then deletes its cap to the
    # set.  Once boot is done, init releases it, and it exits (#826).
    # It is first, so that the console can have a cap set: a launch
    # without one carries at most three caps (#234).  So it has no
    # console.
    - launch: bootcaps
      oid: 14
      priority: device_driver
      cap_set: none
      caps: [exit]
      exports:
        cap_set: Caps.Constructor.Create_Endpoint
        bootcaps_release: Common.Resource.Release_Endpoint

    # The boot console's screen and cursor aren't recorded as granted,
    # because the persistent console takes the screen over from the boot
    # console (#304).
    - launch: console
      oid: 3
      priority: low
      caps:
        - {device_page: 0xB8, owner: none}
        - {ports: [out_range, 8, 0x3D4, 0x3D5], owner: none}
        # With a framebuffer, the VGA text page isn't on the screen, so
        # the boot console writes to the serial port, COM1, which the
        # kernel writes to too, and keeps a copy for the persistent
        # console (#654). The framebuffer tag says which.
        - {ports: [out, 8, 0x3F8, 0x3F8], owner: none}
        - {ports: [in, 8, 0x3FD, 0x3FD], owner: none}
        - {boot_tag: 8}
        # The kernel's command line, and COM2: serial-console asks for a
        # copy of the console on COM2, apart from the kernel's log on
        # COM1, for the boot tests (#904).
        - {boot_tag: 1}
        - {ports: [out, 8, 0x2F8, 0x2F8], owner: none}
        - {ports: [in, 8, 0x2FD, 0x2FD], owner: none}
      exports:
        console_interface: Streams.Writer.Writer_Interface
        console_stream: Streams.Writer.Write_Endpoint
        console_redirect: Streams.Output_Redirect.Redirect_Endpoint

    # Where Init.Calls.Send_String reports, as when the installer refuses
    # a cap request.
    - call: Set_Console

    - launch: mem
      oid: 4
      priority: memory
      caps: [console_interface, region_count, get_region, page_on, trace,
             hold_calls, release_calls, swap_processes, process_state,
             kernel_log, free_caps, add_copy_frames, copy_saved_page,
             end_page_copies]
      exports:
        mem: Processes.Memory.Memory_Interface
        memory_checkpoint: Processes.Memory.Checkpoint_Endpoint
        mem_set_process_banks: Processes.Memory.Set_Process_Banks_Endpoint
        # For the restore server, to have mem end the processes that the
        # restored store has queued to end, before any runs (#1174).
        mem_processes_ended: Processes.Memory.Processes_Ended_Endpoint
        mem_set_page_log: Processes.Memory.Set_Page_Log_Endpoint
        # For the log server, to say that an entry is committed, so
        # that mem cleans the log (#952).
        mem_log_committed: Processes.Memory.Log_Committed_Endpoint
        memory_restore: Checkpoints.Memory_Restore.Memory_Restore_Interface
        mem_replace_process: Processes.Replacer.Replacer_Interface

    - launch: timer
      oid: 13
      priority: device_driver
      caps: [console_interface, set_timeout, get_ticks_64]
      exports:
        timer: Time.Timer.Set_Timer_Endpoint
        timer_interface: Time.Timer.Timer_Interface

    - endpoint: Time.Timeout.On_Timeout_Endpoint
      receiver: receive_timeout
      sender: send_timeout

    - launch: pci
      oid: 5
      priority: low
      caps:
        - console_interface
        - {ports: [out, 32, 0xCF8, 0xCF8]}
        - {ports: [out, 32, 0xCFC, 0xCFC]}
        - {ports: [in, 32, 0xCFC, 0xCFC]}
      exports:
        pci: Devices.Pci_Bus.Pci_Bus_Interface

    - launch: ata
      oid: 6
      priority: device_driver
      caps:
        - console_interface
        - pci
        - {interrupt: 46}
        - {interrupt: 47}
        - {ports: [out_range, 8, 0x1F0, 0x1F7]}
        - {ports: [out, 8, 0x3F6, 0x3F6]}
        - {ports: [in, 8, 0x1F0, 0x1F7]}
        - {ports: [in, 16, 0x1F0, 0x1F7]}
        - {ports: [out, 16, 0x1F0, 0x1F7]}
        - timer
      exports:
        hd0: {endpoint: Get_Interface_Endpoint, identifier: 0}
        # The install media is hd1, which only the install init uses.
        hd1: {endpoint: Get_Interface_Endpoint, identifier: 1,
              when: install}

    - launch: store
      oid: 7
      priority: device_driver
      # kernel_log: the store writes to the kernel's log, not the console,
      # since it serves mem (#1212).
      caps: [console_interface, trace, kernel_log]
      exports:
        storage: Storage.Store.Store_Interface
        add_storage: Storage.Store.Add_Backing_Store_Endpoint
        # For the checkpoint server, to add the region table to each
        # checkpoint.
        store_checkpoint: Checkpoints.Storage_Checkpoint.Checkpoint_Endpoint
        # For the log server, to say that an entry is committed (ADR
        # 0038, section 6).
        store_committed: Checkpoints.Storage_Checkpoint.Committed_Endpoint
        store_restore: Checkpoints.Storage_Checkpoint.Storage_Checkpoint_Interface
        # For mem: which bank is each process's own (ADR 0015, #750).
        process_banks: Storage.Process_Banks.Process_Banks_Interface

    # Mem is launched before the store, so it is given the store's
    # Process_Banks once the store is running, on every boot (#750).
    - call: Connect_Process_Banks

    - launch: elf
      oid: 12
      priority: device_driver
      caps: [rescind, console_interface, mem, create_process, trace]
      exports:
        launch_elf: Processes.Executable.Launch_Endpoint
        launch_command_elf: Processes.Executable.Launch_Command_Endpoint

    - launch: scan
      oid: 10
      priority: file_system
      caps: [console_interface, hd0, exit]
      exports:
        release_partitions: Storage.Partitions.Release_Endpoint
        partition_count: Storage.Partitions.Partition_Count_Endpoint
        get_partition: Storage.Partitions.Get_Partition_Endpoint

    # Partition servers for the swap and log partitions, and on the
    # install media, for block 0 and the two boot partitions (#322).
    - call: Load_Partitions
      sets: [swap, log, mbr, bios_boot, boot_partition]

    - endpoint: Processes.Exec.Install_Endpoint
      receiver: install_receiver
      sender: install_endpoint

    # isofs deletes the caps of the file readers that are released
    # (ADR 0009), with the Delete flag (#1022).
    - launch: isofs
      when: install
      oid: 8
      priority: file_system
      caps: [console_interface, hd1]
      exports:
        install_media_fs: Files.File_System.Root_Directory_Endpoint

    - launch: log
      oid: 16
      priority: log
      caps: [console_interface, start_log, store_committed,
             mem_log_committed]
      exports:
        add_log_device: Checkpoints.Kernel_Log.Add_Log_Device_Endpoint
        append_to_log: Checkpoints.Kernel_Log.Append_Endpoint
        log_reader: Checkpoints.Log_Reader.Log_Reader_Interface
        log_reset: Checkpoints.State.Reset_Endpoint
        # For the checkpoint server, to learn whether a checkpoint's
        # entry was committed (#984).
        log_last_entry: Checkpoints.Log_Reader.Last_Entry_Endpoint
        # For mem, to append to the open entry and read pages back (ADR
        # 0028).
        page_log: Checkpoints.Page_Log.Page_Log_Interface

    # Mem is launched before the log server, so it is given the log's
    # Page_Log once the log server is running, on every boot.
    - call: Connect_Page_Log

    # In the order Restore.Start takes them.  Only restore-install has
    # the last nine: five to install from the install media, start a new
    # log, and write the boot loader (#322), and four to ask before it
    # erases hd0 (#836).  It reads the keyboard controller itself,
    # because the keyboard driver only starts after the install; the
    # ports go to nobody, so that the driver can have them too.  The
    # kernel's command line says whether to erase.
    - launch: restore
      oid: 9
      priority: file_system
      caps:
        - console_interface
        - swap
        - log
        - add_storage
        - install_endpoint
        - add_log_device
        - log_reader
        - restore_process
        - resume_process
        - restore_interrupt
        - store_restore
        - memory_restore
        - restore_derivations
        - exit
        - mem_processes_ended
        - {cap: install_media_fs, when: install}
        - {cap: log_reset, when: install}
        - {cap: mbr, when: install}
        - {cap: bios_boot, when: install}
        - {cap: boot_partition, when: install}
        - {cap: timer, when: install}
        - {ports: [in, 8, 0x64, 0x64], owner: none, when: install}
        - {ports: [in, 8, 0x60, 0x60], owner: none, when: install}
        - {boot_tag: 1, when: install}
        # Calls the restored exec and command registry on the update boot
        # (#829).
        - {cap: restored_endpoint, when: install}
        # Replaces the restored Replaceable servers on the update boot
        # (#830, ADR 0032 section 1).
        - {cap: mem_replace_process, when: install}

  # After the restore server has restored a checkpoint or installed a new
  # system.
  checkpoint:

    - launch: checkpoint
      oid: 15
      priority: checkpoint
      caps: [console_interface, timer, enter_checkpoint, leave_checkpoint,
             memory_checkpoint, append_to_log, store_checkpoint,
             checkpoint_hold, log_last_entry]
      exports:
        checkpointer: Checkpoints.Checkpointer.Take_Checkpoint_Endpoint
