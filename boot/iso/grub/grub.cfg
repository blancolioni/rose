set timeout=5

function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod efi_gop
    insmod efi_uga
    insmod ieee1275_fb
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}
set gfxmode=1024x768x32,auto
load_video
insmod gfxterm
loadfont unicode
insmod png
terminal_output gfxterm
#background_image /images/rose-splash.png
set color_normal=white/black
set color_highlight=yellow/black

# The kernel asks for a framebuffer (#582), and the first install entry
# keeps the one GRUB sets up: the console is then on the screen's surface
# (#653).  The others keep text mode, with gfxpayload=text after the
# multiboot2 command, which sets gfxpayload from the kernel's request: the
# trace entry, whose trace goes to the VGA text page, and the text mode
# entry, which is last, for scripts/test-boot and test-clock, which read
# the VGA text page, and for a machine where the framebuffer doesn't
# work.  Until #654, the early messages are on the VGA text page, so with
# a framebuffer nothing is seen until the console starts.
#
# The erasing entry, after the first, installs over whatever hd0 has,
# once the person installing has typed "erase" (#836): erase-hd0 on the
# kernel's command line tells restore-install.  It keeps text mode, so
# that restore-install's question is on the screen, and not only on the
# serial port.
#
# @VERSION@ is Rose's version, from Rose.Version, which
# scripts/rose-iso-install puts in the copy on the install media.

# A disk that already has Rose boots from its own boot partition, the
# second GPT partition, by default: after an install has restarted the
# machine, and whenever the install media is left in (#413).  Installing
# again is the next entry.

insmod part_gpt
insmod fat
if [ -f (hd0,gpt2)/boot/grub/grub.cfg ]; then
    menuentry "Rose (from hd0)" {
        set root=(hd0,gpt2)
        configfile /boot/grub/grub.cfg
    }
fi

menuentry "Install Rose @VERSION@" {
    multiboot2 /boot/kernel
    module2 /boot/init-install init-install
    module2 /boot/console console
    module2 /boot/mem mem
    module2 /boot/pci pci
    module2 /boot/ata ata
    module2 /boot/store store
    module2 /boot/isofs isofs
    module2 /boot/restore-install restore-install
    module2 /boot/scan scan
    module2 /boot/partition partition
    module2 /boot/elf elf
    module2 /boot/timer timer
    module2 /boot/bootcaps bootcaps
    module2 /boot/checkpoint checkpoint
    module2 /boot/log log
    boot
}

menuentry "Install Rose @VERSION@, erasing hd0" {
    multiboot2 /boot/kernel erase-hd0
    set gfxpayload=text
    module2 /boot/init-install init-install
    module2 /boot/console console
    module2 /boot/mem mem
    module2 /boot/pci pci
    module2 /boot/ata ata
    module2 /boot/store store
    module2 /boot/isofs isofs
    module2 /boot/restore-install restore-install
    module2 /boot/scan scan
    module2 /boot/partition partition
    module2 /boot/elf elf
    module2 /boot/timer timer
    module2 /boot/bootcaps bootcaps
    module2 /boot/checkpoint checkpoint
    module2 /boot/log log
    boot
}

menuentry "Install Rose @VERSION@ (trace launches)" {
    multiboot2 /boot/kernel trace-launch
    set gfxpayload=text
    module2 /boot/init-install init-install
    module2 /boot/console console
    module2 /boot/mem mem
    module2 /boot/pci pci
    module2 /boot/ata ata
    module2 /boot/store store
    module2 /boot/isofs isofs
    module2 /boot/restore-install restore-install
    module2 /boot/scan scan
    module2 /boot/partition partition
    module2 /boot/elf elf
    module2 /boot/timer timer
    module2 /boot/bootcaps bootcaps
    module2 /boot/checkpoint checkpoint
    module2 /boot/log log
    boot
}

menuentry "Install Rose @VERSION@ (text mode)" {
    multiboot2 /boot/kernel
    set gfxpayload=text
    module2 /boot/init-install init-install
    module2 /boot/console console
    module2 /boot/mem mem
    module2 /boot/pci pci
    module2 /boot/ata ata
    module2 /boot/store store
    module2 /boot/isofs isofs
    module2 /boot/restore-install restore-install
    module2 /boot/scan scan
    module2 /boot/partition partition
    module2 /boot/elf elf
    module2 /boot/timer timer
    module2 /boot/bootcaps bootcaps
    module2 /boot/checkpoint checkpoint
    module2 /boot/log log
    boot
}
