#  A boot set's menu entries (#828).  scripts/make-boot-disk puts this
#  in the set's tar, which the boot partition's menu (boot/hd0/grub.cfg)
#  opens as GRUB's root, so the paths are in the tar.  It loads the boot
#  disk's init and restore (#373).  The module2 lines are written by the
#  build, from src/servers/init/boot.yaml (#374), and have to match the
#  boot disk's list in src/kernel/modules/rose-kernel-modules-init.adb.
#
#  The kernel asks for a framebuffer (#582), and the first entry keeps the
#  one GRUB sets up.  The others keep text mode, with gfxpayload=text
#  after the multiboot2 command, which sets gfxpayload from the kernel's
#  request: the trace entry, and the text mode entry, which is last, for
#  the boot tests and for a system installed in text mode.  A system
#  boots the way it was installed: the console it was installed with is
#  restored.
#
#  @VERSION@ is Rose's version, from Rose.Version, which
#  scripts/make-boot-disk puts in the copy in the set.

menuentry "Rose @VERSION@" {
    multiboot2 /kernel
    module2 /init init
    module2 /console console
    module2 /mem mem
    module2 /pci pci
    module2 /ata ata
    module2 /store store
    module2 /restore restore
    module2 /scan scan
    module2 /partition partition
    module2 /elf elf
    module2 /timer timer
    module2 /bootcaps bootcaps
    module2 /checkpoint checkpoint
    module2 /log log
    boot
}

menuentry "Rose @VERSION@ (trace launches)" {
    multiboot2 /kernel trace-launch
    set gfxpayload=text
    module2 /init init
    module2 /console console
    module2 /mem mem
    module2 /pci pci
    module2 /ata ata
    module2 /store store
    module2 /restore restore
    module2 /scan scan
    module2 /partition partition
    module2 /elf elf
    module2 /timer timer
    module2 /bootcaps bootcaps
    module2 /checkpoint checkpoint
    module2 /log log
    boot
}

menuentry "Rose @VERSION@ (text mode)" {
    multiboot2 /kernel
    set gfxpayload=text
    module2 /init init
    module2 /console console
    module2 /mem mem
    module2 /pci pci
    module2 /ata ata
    module2 /store store
    module2 /restore restore
    module2 /scan scan
    module2 /partition partition
    module2 /elf elf
    module2 /timer timer
    module2 /bootcaps bootcaps
    module2 /checkpoint checkpoint
    module2 /log log
    boot
}

menuentry "Rose @VERSION@ (text mode, serial console)" {
    multiboot2 /kernel serial-console
    set gfxpayload=text
    module2 /init init
    module2 /console console
    module2 /mem mem
    module2 /pci pci
    module2 /ata ata
    module2 /store store
    module2 /restore restore
    module2 /scan scan
    module2 /partition partition
    module2 /elf elf
    module2 /timer timer
    module2 /bootcaps bootcaps
    module2 /checkpoint checkpoint
    module2 /log log
    boot
}
