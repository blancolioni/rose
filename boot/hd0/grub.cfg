# rose-boot-set @SLOT@ @VERSION@
#
#  The boot partition's GRUB menu (#322).  The partition holds two boot
#  sets (#828), /boot/a.tar and /boot/b.tar.  Each is a kernel and the
#  boot disk's boot modules, with its own menu entries in menu.cfg
#  (boot/hd0/menu.cfg).  This menu opens the current set and shows its
#  entries, and after an update, an entry for the set before it.
#
#  scripts/make-boot-disk writes it from boot/hd0/grub.cfg.  The first
#  line names the current set and its version, and the update boot reads
#  it (Restore.Boot_Sets).  The menu is padded to 4096 bytes, one block
#  of the boot partition, so that an update writes it at once.

set timeout=5

# The menu is drawn in a 1024x768 graphics mode, over the rose splash, as
# the install media's is.

function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}
set gfxmode=1024x768x32,auto
load_video
insmod gfxterm
loadfont unicode
insmod png
terminal_output gfxterm
background_image /boot/grub/images/rose-splash.png
set color_normal=white/black
set color_highlight=yellow/black

insmod loopback
insmod tar
set rose_boot=$root
loopback rose_current ($rose_boot)/boot/@SLOT@.tar
set root=rose_current
source /menu.cfg

### previous
menuentry "Previous: Rose @PREVIOUS_VERSION@" {
    loopback rose_previous ($rose_boot)/boot/@OTHER@.tar
    set root=rose_previous
    configfile /menu.cfg
}
### end previous
