#  The boot disk's GRUB menu (#322), copied to the boot partition by
#  scripts/make-boot-disk.  It loads the boot disk's init and restore
#  (#373).  The module2 lines are written by the build, from
#  src/servers/init/boot.yaml (#374), and have to match the boot disk's
#  list in src/kernel/modules/rose-kernel-modules-init.adb.

set timeout=5

# The menu is drawn in a 1024x768 graphics mode, over the rose splash, as
# the install media's is.  make-boot-disk copies the image and the font
# to the boot partition.

function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}
set gfxmode=1024x768x32,auto
load_video
insmod gfxterm
loadfont unicode
insmod png
terminal_output gfxterm
background_image /boot/grub/images/rose-splash.png
set color_normal=white/black
set color_highlight=yellow/black

# The kernel asks for a framebuffer (#582), and the first entry keeps the
# one GRUB sets up.  The others keep text mode, with gfxpayload=text after
# the multiboot2 command, which sets gfxpayload from the kernel's request:
# the trace entry, and the text mode entry, which is last, for the boot
# tests and for a system installed in text mode.  A system boots the way
# it was installed: the console it was installed with is restored.
#
# @VERSION@ is Rose's version, from Rose.Version, which
# scripts/make-boot-disk puts in the copy on the boot partition.

menuentry "Rose @VERSION@" {
    multiboot2 /boot/kernel
    module2 /boot/init init
    module2 /boot/console console
    module2 /boot/mem mem
    module2 /boot/pci pci
    module2 /boot/ata ata
    module2 /boot/store store
    module2 /boot/restore restore
    module2 /boot/scan scan
    module2 /boot/partition partition
    module2 /boot/elf elf
    module2 /boot/timer timer
    module2 /boot/caps caps
    module2 /boot/checkpoint checkpoint
    module2 /boot/log log
    boot
}

menuentry "Rose @VERSION@ (trace launches)" {
    multiboot2 /boot/kernel trace-launch
    set gfxpayload=text
    module2 /boot/init init
    module2 /boot/console console
    module2 /boot/mem mem
    module2 /boot/pci pci
    module2 /boot/ata ata
    module2 /boot/store store
    module2 /boot/restore restore
    module2 /boot/scan scan
    module2 /boot/partition partition
    module2 /boot/elf elf
    module2 /boot/timer timer
    module2 /boot/caps caps
    module2 /boot/checkpoint checkpoint
    module2 /boot/log log
    boot
}

menuentry "Rose @VERSION@ (text mode)" {
    multiboot2 /boot/kernel
    set gfxpayload=text
    module2 /boot/init init
    module2 /boot/console console
    module2 /boot/mem mem
    module2 /boot/pci pci
    module2 /boot/ata ata
    module2 /boot/store store
    module2 /boot/restore restore
    module2 /boot/scan scan
    module2 /boot/partition partition
    module2 /boot/elf elf
    module2 /boot/timer timer
    module2 /boot/caps caps
    module2 /boot/checkpoint checkpoint
    module2 /boot/log log
    boot
}
