name: CI

# Builds Rose from scratch and boot-tests the ISO under QEMU (make test), on
# every pull request and every push to main.  Fedora 43 is what the build is
# known to work on (see the README).  QEMU has no KVM on a hosted runner, so
# the boot test is slow.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    container: fedora:43
    timeout-minutes: 90
    env:
      ALIRE_VERSION: 2.1.0
      # idle and Syn are built from these refs.  Set them to commits to pin
      # them.
      SYN_REF: main
      IDLE_REF: main
      # The boot tests make their directories here (qemu-test-lib.sh),
      # which is where "Keep the logs of a failure" looks. Their default,
      # ~/scratch, is for the dev server, whose /tmp is small.
      ROSE_TEST_DIR: /tmp
    steps:
      - name: Install the build requirements
        run: |
          dnf install -y --setopt=install_weak_deps=False \
              git-core make gcc gcc-gnat gprbuild binutils findutils gawk sed \
              python3 python3-pyyaml xorriso grub2-tools grub2-tools-extra \
              grub2-pc-modules mtools qemu-img qemu-system-x86-core \
              curl unzip

      - uses: actions/checkout@v4

      # The container runs as root, but the checkout belongs to the runner,
      # so git refuses it unless it's marked safe.  check-endpoint-ids
      # compares the endpoint ids with those at the first tag of the
      # release series (#827), and the checkout has no tags.
      - name: Fetch the tags
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin '+refs/tags/v*:refs/tags/v*'

      # idle needs Syn next to it.  Alire builds idle with the GNAT that is
      # installed above.
      - name: Build idle
        run: |
          curl -sSfL -o alr.zip "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip -q alr.zip -d "$HOME/alire"
          export PATH="$HOME/alire/bin:$PATH"
          alr settings --global --set toolchain.assistant false
          # The solver gives up after 5 seconds by default and then builds
          # without Syn.
          alr settings --global --set solver.timeout 600
          git clone https://github.com/blancolioni/syn ../syn
          git -C ../syn checkout "$SYN_REF"
          git clone https://github.com/blancolioni/idle ../idle
          git -C ../idle checkout "$IDLE_REF"
          (cd ../idle && alr --non-interactive build)
          echo "IDLE=$(realpath ../idle)/bin/idle" >> "$GITHUB_ENV"

      - name: Check the build requirements
        run: make check-env

      - name: Test the drawing library
        run: make test-drawing

      - name: Build
        run: ./clean-build.sh

      - name: Boot test
        run: make test

      # The checkpoint of the series' first release, restored by this
      # build (#737). It passes with a message until that release has a
      # fixture.
      - name: Restore test
        run: make test-restore

      - name: Keep the logs of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            logs
            /tmp/rose-test.*/serial
            /tmp/rose-test.*/qemu.log
          if-no-files-found: ignore
