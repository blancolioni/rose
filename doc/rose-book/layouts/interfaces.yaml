# Bit layouts for the interfaces chapter, drawn by scripts/bitlayout.py.
# See layouts/capabilities.yaml for the format.
#
# "make check-layouts" compares these with the Ada records.

word: 32

diagrams:
  # A request to the meta interface for an interface capability, drawn
  # on the invocation record up to the second parameter word.  The
  # values are those of the request; the parameter words are not
  # checked, since the record has a single Data component.
  interface-cap-request:
    title: Interface capability request
    rows:
      - - [13, Flags]
        - [4, SW (1)]
        - [4, RW (0)]
        - [4, SC (0)]
        - [4, RC (0)]
        - [3, rsvd]
      - {words: 1, name: Capability (1)}
      - {words: 1, name: Reply Capability}
      - {words: 2, name: Endpoint Id (1)}
      - - [16, Identifier]
        - [8, unused]
        - [4, Error]
        - [4, Extra]
      - {words: 1, name: Interface Id}
      - - [8, unused]
        - [8, Release]
        - [8, Minor Version]
        - [8, Major Version]
    check:
      records:
        - record: Rose.Invocation.Control_Word
          fields:
            Flags: Flags
            SW (1): Last_Sent_Word
            RW (0): Last_Recv_Word
            SC (0): Last_Sent_Cap
            RC (0): Last_Recv_Cap
            rsvd: Reserved
        - record: Rose.Invocation.Invocation_Record
          fields:
            Capability (1): Cap
            Reply Capability: Reply_Cap
            Endpoint Id (1): Endpoint
            Identifier: Identifier
            Error: Error
            Extra: Extra_Errors
