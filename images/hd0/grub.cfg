#  The boot disk's GRUB menu (#322), copied to the boot partition by
#  scripts/make-boot-disk.  It loads the boot disk's init and restore
#  (#373).  The modules' order has to match Disk_Modules in
#  src/servers/init/src/init-run.adb, and the boot disk's list in
#  src/kernel/modules/rose-kernel-modules-init.adb.

set timeout=5

menuentry "Rose" {
    multiboot2 /boot/kernel
    module2 /boot/init init
    module2 /boot/console console
    module2 /boot/mem mem
    module2 /boot/pci pci
    module2 /boot/ata ata
    module2 /boot/store store
    module2 /boot/restore restore
    module2 /boot/scan scan
    module2 /boot/partition partition
    module2 /boot/elf elf
    module2 /boot/timer timer
    module2 /boot/caps caps
    module2 /boot/checkpoint checkpoint
    module2 /boot/log log
    boot
}

menuentry "Rose (trace launches)" {
    multiboot2 /boot/kernel trace-launch
    module2 /boot/init init
    module2 /boot/console console
    module2 /boot/mem mem
    module2 /boot/pci pci
    module2 /boot/ata ata
    module2 /boot/store store
    module2 /boot/restore restore
    module2 /boot/scan scan
    module2 /boot/partition partition
    module2 /boot/elf elf
    module2 /boot/timer timer
    module2 /boot/caps caps
    module2 /boot/checkpoint checkpoint
    module2 /boot/log log
    boot
}
